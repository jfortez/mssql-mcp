[package]
name = "mssql-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native Model Context Protocol server for Microsoft SQL Server"
license = "Apache-2.0"
readme = "README.md"
keywords = ["mcp", "mssql", "sql-server", "tds"]
categories = ["command-line-utilities", "database"]
include = ["/src/**", "/tests/**", "/README.md", "/assets/icon.svg", "/LICENSE"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server", "elicitation"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tiberius = { version = "=0.13.0", default-features = false, features = ["rustls", "tds73"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }

[target.'cfg(unix)'.dependencies]
tiberius = { version = "=0.13.0", default-features = false, features = ["sspi-rs"] }

[target.'cfg(windows)'.dependencies]
tiberius = { version = "=0.13.0", default-features = false, features = ["winauth"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = "symbols"
lto = "thin"
