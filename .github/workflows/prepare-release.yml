name: Prepare release

# Manual only: merging never opens a release pull request or publishes anything.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to release as MAJOR.MINOR.PATCH; empty uses the manifest version
        type: string
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare the release pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require the default branch
        env:
          EVENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Run Prepare release from the default branch ($DEFAULT_BRANCH), not $EVENT_REF."
            exit 1
          fi

      - name: Check out the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Prepare the release notes and version
        id: prepare
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION=$(python3 -B .github/scripts/release_pr.py prepare "$INPUT_VERSION")
          else
            VERSION=$(python3 -B .github/scripts/release_pr.py prepare)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo +stable fmt --all --check

      - name: Run tests
        run: cargo +stable test --locked

      - name: Run Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings

      - name: Verify the package
        run: cargo +stable package --locked --allow-dirty

      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 -B .github/scripts/release_pr.py open \
            "$RELEASE_VERSION" "$DEFAULT_BRANCH" "$REPOSITORY"
